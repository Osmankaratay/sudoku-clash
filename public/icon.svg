<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with squircle border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#F59E0B" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Subtle 3x3 Grid Matrix in background -->
  <g opacity="0.18" stroke="#94A3B8" stroke-width="4">
    <line x1="100" y1="184" x2="412" y2="184"/>
    <line x1="100" y1="268" x2="412" y2="268"/>
    <line x1="100" y1="352" x2="412" y2="352"/>
    <line x1="184" y1="100" x2="184" y2="412"/>
    <line x1="268" y1="100" x2="268" y2="412"/>
    <line x1="352" y1="100" x2="352" y2="412"/>
  </g>

  <!-- Central "9" Emblem / Sudoku Crown -->
  <g filter="url(#glow)">
    <!-- 3x3 grid cells highlight -->
    <rect x="272" y="104" width="76" height="76" rx="14" fill="#F59E0B" fill-opacity="0.25" stroke="#FBBF24" stroke-width="3"/>
    <rect x="188" y="188" width="76" height="76" rx="14" fill="#F59E0B" fill-opacity="0.35" stroke="#FBBF24" stroke-width="3"/>
    <rect x="272" y="188" width="76" height="76" rx="14" fill="#F59E0B" fill-opacity="0.45" stroke="#FBBF24" stroke-width="3"/>
    <rect x="272" y="272" width="76" height="76" rx="14" fill="#F59E0B" fill-opacity="0.25" stroke="#FBBF24" stroke-width="3"/>
    <rect x="188" y="356" width="76" height="76" rx="14" fill="#F59E0B" fill-opacity="0.2" stroke="#FBBF24" stroke-width="3"/>

    <!-- Dynamic Stylized "9" (Nueve) -->
    <path d="M 310 130 C 235 130 185 180 185 245 C 185 305 230 350 290 350 C 335 350 365 320 375 285 C 380 265 375 240 350 230 C 320 220 285 230 270 250 C 260 262 250 272 235 272 C 220 272 210 260 210 245 C 210 210 240 180 305 180 C 345 180 370 205 370 250 C 370 330 315 410 220 415 C 205 416 195 404 198 390 C 200 378 212 370 225 368 C 295 360 335 305 338 250 C 328 260 310 265 292 265 C 255 265 225 238 225 200 C 225 160 260 130 310 130 Z" fill="url(#amberGrad)"/>
  </g>

  <!-- Sparkle Accent Stars -->
  <path d="M 390 120 L 395 138 L 413 143 L 395 148 L 390 166 L 385 148 L 367 143 L 385 138 Z" fill="#FDE68A"/>
  <path d="M 125 340 L 129 352 L 141 356 L 129 360 L 125 372 L 121 360 L 109 356 L 121 352 Z" fill="#FDE68A"/>
</svg>
